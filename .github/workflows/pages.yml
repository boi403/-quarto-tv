# Publica a tela do quarto + a playlist no GitHub Pages (branch gh-pages)
# a cada push na main.
# Os canais NÃO são testados aqui (servidores do GitHub ficam fora do Brasil
# e derrubariam canais com bloqueio regional): rode `npm run canais` no PC
# e faça commit do resultado.
name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx vite build
      - run: touch dist/.nojekyll
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist
          publish_branch: gh-pages
